{% extends 'accounts/base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-xl border border-gray-100">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900">Welcome Back</h2>
            <p class="text-sm text-gray-600 mt-2">Login to access the exclusive UET student network.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-5">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Student Email</label>
                <input class="appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" id="email" type="email" name="email" required placeholder="you@uet.edu.pk">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
                <input class="appearance-none border rounded w-full py-3 px-4 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" id="password" type="password" name="password" required placeholder="••••••••">
            </div>
            <div>
                <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded focus:outline-none focus:shadow-outline transition duration-150 ease-in-out" type="submit">
                    Sign In to StudentHub
                </button>
            </div>
        </form>
        <div class="text-center mt-6 pt-6 border-t border-gray-200">
            <p class="text-sm text-gray-600">Don't have an account?</p>
            <a href="{% url 'accounts:register' %}" class="mt-2 inline-block font-bold text-blue-600 hover:text-blue-800">Register as a new student</a>
        </div>
    </div>
</div>
{% endblock %}
