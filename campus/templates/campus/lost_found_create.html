{% extends 'accounts/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded shadow-md">
    <h2 class="text-2xl font-bold mb-6">Report Lost/Found Item</h2>
    <form method="post">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Type</label>
                <select name="item_type" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                    {% for value, label in item_types %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Date Lost/Found</label>
                <input type="date" name="date_lost_found" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
            </div>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Item Name</label>
            <input type="text" name="item_name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" placeholder="e.g. Black Wallet, Keys" required>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Contact Info</label>
            <input type="text" name="contact_info" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" placeholder="e.g. WhatsApp number or Department" required>
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Description</label>
            <textarea name="description" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" rows="3" placeholder="Provide details like color, brand, or location where it was lost/found." required></textarea>
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full">Submit Report</button>
    </form>
</div>
{% endblock %}
