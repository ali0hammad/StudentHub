{% extends 'accounts/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded shadow-md">
    <h2 class="text-2xl font-bold mb-6">Add Task for {{ group.name }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Title</label>
            <input type="text" name="title" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Description</label>
            <textarea name="description" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" rows="3"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Deadline</label>
                <input type="date" name="deadline" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Assign To</label>
                <select name="assigned_to" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
                    <option value="">Unassigned</option>
                    {% for member in group.members.all %}
                        <option value="{{ member.id }}">{{ member.first_name|default:member.email }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="flex justify-between items-center">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Add Task</button>
            <a href="{% url 'projects:group_detail' group.id %}" class="text-gray-600 hover:underline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
